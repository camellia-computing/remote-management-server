name: Dynamic Boundaries

on:
  schedule:
    - cron: "31 3 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  management-boundaries:
    name: Bounded Management JSON mutation corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CAMELLIA_REMOTE_DEBUG: "true"
      CAMELLIA_REMOTE_SECRET_KEY: dynamic-boundary-ci-only-secret-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Run fixed-size JSON mutation corpus
        run: uv run pytest api/test_dynamic_input_contract.py
