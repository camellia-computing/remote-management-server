name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-management-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      runtime: ${{ steps.changes.outputs.runtime }}
      automation: ${{ steps.changes.outputs.automation }}
      dependencies: ${{ steps.changes.outputs.dependencies }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          bash .github/scripts/classify-changes.sh

  metadata:
    name: Validate component version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release metadata
        id: release
        run: |
          python scripts/test_release_metadata.py
          python scripts/release_metadata.py --github-output

  dependency_review:
    name: Review dependency changes
    if: >-
      github.event_name == 'pull_request' &&
      needs.classify.outputs.dependencies == 'true'
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Review dependency graph delta
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never

  release_dependency:
    name: Validate release dependencies
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'release/next' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read-only client Release token
        id: client-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ fromJSON(vars.REMOTE_REPOSITORY_MAP)['remote-client'] }}
          permission-contents: read
          permission-metadata: read

      - name: Validate exact completed client Release
        env:
          GH_TOKEN: ${{ steps.client-token.outputs.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RELEASE_APP_LOGIN: ${{ vars.RELEASE_APP_LOGIN }}
          REMOTE_REPOSITORY_MAP: ${{ vars.REMOTE_REPOSITORY_MAP }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$PR_BASE_SHA^{commit}"
          [[ "$(git rev-parse origin/main)" == "$PR_BASE_SHA" ]]
          control="$RUNNER_TEMP/release-dependency-control"
          output="$RUNNER_TEMP/release-dependency-evidence"
          mkdir -m 700 "$control" "$output"
          for script in \
            resolve-remote-client-release.py \
            validate-release-evidence.py
          do
            git show "$PR_BASE_SHA:.github/scripts/$script" > "$control/$script"
          done
          mapfile -t lock_lines < web-client.lock
          [[ ${#lock_lines[@]} -eq 1 && "${lock_lines[0]}" =~ ^[0-9a-f]{40}$ ]]
          python3 "$control/resolve-remote-client-release.py" \
            --repository-map "$REMOTE_REPOSITORY_MAP" \
            --owner "$GITHUB_REPOSITORY_OWNER" \
            --current-repository "$GITHUB_REPOSITORY" \
            --release-app-login "$RELEASE_APP_LOGIN" \
            --commit "${lock_lines[0]}" \
            --output-directory "$output"

  automation:
    name: Workflow and synchronization automation
    if: needs.classify.outputs.automation == 'true'
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv for policy contract tests
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Audit workflow security
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          inputs: .github
          online-audits: false
          persona: pedantic
          version: 1.28.0
          advanced-security: false
          annotations: true

      - name: Install pinned age for backup integration tests
        run: |
          go install filippo.io/age/cmd/...@v1.2.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Lint workflows and shell scripts
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          shellcheck \
            .github/scripts/*.sh \
            .github/scripts/tests/*.sh \
            deploy/backup-postgres.sh \
            deploy/bootstrap-postgres-roles.sh \
            deploy/management-maintenance-guard.sh \
            deploy/management-maintenance.sh \
            deploy/run-cleanup.sh \
            deploy/run-compose-operation.sh \
            deploy/restore-postgres.sh \
            deploy/start-management-stack.sh \
            run.sh \
            sync_web_client.sh \
            scripts/web_client_revision.sh
          python3 scripts/test_backup_envelope.py
          python3 scripts/test_backup_scripts.py
          python3 scripts/test_compose_operation_runner.py
          python3 scripts/test_database_roles.py
          python3 scripts/test_deployment_gate.py
          python3 scripts/test_dynamic_boundary_policy.py
          python3 scripts/test_postgres_container_hardening.py
          python3 scripts/test_production_compose.py
          python3 scripts/test_production_compose.py --systemd-contract
          python3 scripts/test_ci_trust_boundary.py
          uv run --locked python scripts/test_coverage_contract.py
          python3 scripts/test_systemd_maintenance.py
          python3 .github/scripts/test_manage_release.py
          python3 .github/scripts/test_container_release_evidence.py
          python3 .github/scripts/test_resolve_remote_client_release.py
          python3 scripts/test_deployment_dependencies.py
          python3 scripts/deployment_dependencies.py validate-policy
          bash .github/scripts/tests/test_resolve_container_registries.sh
          bash .github/scripts/tests/test_verify_release_image.sh
          bash -n .github/scripts/publish-container-release.sh

      - name: Validate Remote system preflight inputs
        env:
          REMOTE_REPOSITORY_MAP: ${{ vars.REMOTE_REPOSITORY_MAP }}
        run: |
          python3 scripts/test_remote_system_contract.py
          python3 scripts/remote_system_contract.py \
            --repository-map "$REMOTE_REPOSITORY_MAP" \
            --current-repository "$GITHUB_REPOSITORY"

      - name: Validate deployment configuration
        env:
          CAMELLIA_REMOTE_MANAGEMENT_IMAGE: ghcr.io/example/management@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          CAMELLIA_REMOTE_RELEASE_REVISION: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          CAMELLIA_REMOTE_SECRET_KEY: ci-only-production-secret-key-with-sufficient-length-000
          CAMELLIA_REMOTE_DATA_ENCRYPTION_KEY_ID: ci-primary-v1
          CAMELLIA_REMOTE_DATA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          CAMELLIA_REMOTE_DATA_ENCRYPTION_V1_KEY_ID: ci-primary-v1
          CAMELLIA_REMOTE_DEVICE_VERIFICATION_TOKEN: ci-device-verification-token-with-sufficient-length
          CAMELLIA_REMOTE_DATABASE_BOOTSTRAP_USER: ci_bootstrap
          CAMELLIA_REMOTE_DATABASE_BOOTSTRAP_PASSWORD: "bootstrap test:@/%# password 01"
          CAMELLIA_REMOTE_DATABASE_MIGRATION_USER: ci_migration
          CAMELLIA_REMOTE_DATABASE_MIGRATION_PASSWORD: "migration test:@/%# password 02"
          CAMELLIA_REMOTE_DATABASE_RUNTIME_USER: ci_runtime
          CAMELLIA_REMOTE_DATABASE_RUNTIME_PASSWORD: "runtime test:@/%# password 03"
          CAMELLIA_REMOTE_DATABASE_BACKUP_USER: ci_backup
          CAMELLIA_REMOTE_DATABASE_BACKUP_PASSWORD: "backup test:@/%# password 04"
          CAMELLIA_REMOTE_DATABASE_PROBE_USER: ci_probe
          CAMELLIA_REMOTE_DATABASE_PROBE_PASSWORD: "probe test:@/%# password 05"
          CAMELLIA_REMOTE_ALLOWED_HOSTS: api.example.test
          CAMELLIA_REMOTE_CSRF_TRUSTED_ORIGINS: https://api.example.test
          CAMELLIA_REMOTE_API_SERVER: https://api.example.test
          CAMELLIA_REMOTE_ID_SERVER: wss://remote.example.test:443
          CAMELLIA_REMOTE_RS_PUB_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          CAMELLIA_REMOTE_BACKUP_AGE_RECIPIENT: age1qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq
          CAMELLIA_REMOTE_BACKUP_AGE_KEY_ID: ci-backup-v1
          CAMELLIA_REMOTE_BACKUP_DEPLOYMENT_ID: ci-deployment
          CAMELLIA_REMOTE_BACKUP_POSTGRES_MAJOR: "18"
          CAMELLIA_REMOTE_RATE_LIMIT_ENABLED: "true"
        run: |
          [[ "$CAMELLIA_REMOTE_BACKUP_AGE_RECIPIENT" =~ ^age1[^[:space:]]{20,255}$ ]]
          [[ "$CAMELLIA_REMOTE_BACKUP_AGE_KEY_ID" =~ ^[a-z0-9][a-z0-9._-]{0,31}$ ]]
          [[ "$CAMELLIA_REMOTE_BACKUP_DEPLOYMENT_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]]
          [[ "$CAMELLIA_REMOTE_BACKUP_POSTGRES_MAJOR" =~ ^[1-9][0-9]{0,2}$ ]]
          [[ "$CAMELLIA_REMOTE_RELEASE_REVISION" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]
          systemd-analyze security --offline=yes deploy/systemd/*.service >/dev/null
          docker compose --profile database-operations --env-file /dev/null -f docker-compose.yaml config --quiet

  web_client:
    name: Build pinned Web client
    if: needs.classify.outputs.runtime == 'true'
    needs: [classify, metadata]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read # Query the exact source revision's successful CI run.
      contents: read # Check out the management and locked Web sources.
    outputs:
      revision: ${{ steps.web_client.outputs.revision }}
    steps:
      - name: Checkout API source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Web client
        id: web_client
        uses: ./.github/actions/build-web-client
        with:
          repository-map: ${{ vars.REMOTE_REPOSITORY_MAP }}

      - name: Upload Web runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: camellia-remote-web-${{ steps.web_client.outputs.revision }}
          path: static/web_client
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  quality:
    name: Python and Django quality
    if: needs.classify.outputs.runtime == 'true'
    needs: [classify, web_client]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_DB: camellia_remote_ci
          POSTGRES_USER: camellia_remote_ci
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U camellia_remote_ci -d camellia_remote_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CAMELLIA_REMOTE_DEBUG: "true"
      CAMELLIA_REMOTE_SECRET_KEY: ci-only-secret-key
      CAMELLIA_REMOTE_ALLOWED_HOSTS: "127.0.0.1,localhost"
      CAMELLIA_REMOTE_CSRF_TRUSTED_ORIGINS: "http://127.0.0.1:21114"
      CAMELLIA_REMOTE_DATABASE_URL: postgres://camellia_remote_ci:ci-postgres-password@127.0.0.1:5432/camellia_remote_ci
      CAMELLIA_REMOTE_DATABASE_SSLMODE: disable
      CAMELLIA_REMOTE_DEVICE_VERIFICATION_TOKEN: ci-device-verification-token-with-sufficient-length
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download Web runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: camellia-remote-web-${{ needs.web_client.outputs.revision }}
          path: static/web_client

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Audit dependencies
        run: uv audit --locked --preview-features audit-command

      - name: Static analysis
        run: |
          uv run python -m compileall api webui2 camellia_remote_management scripts
          uv run ruff check api webui2 camellia_remote_management scripts

      - name: Set up Node for browser contract tests
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"

      - name: Browser HTTP and mutation contract tests
        run: node --test scripts/test_browser_http.cjs scripts/test_browser_mutations.cjs scripts/test_mutation_outbox.cjs

      - name: Django checks
        run: |
          uv run python scripts/test_deployment_gate.py
          uv run python manage.py test api.test_migration_compatibility --verbosity 1
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run

      - name: Production settings check
        env:
          CAMELLIA_REMOTE_DEBUG: "false"
          CAMELLIA_REMOTE_SECRET_KEY: ci-only-production-secret-key-with-sufficient-length-000
          CAMELLIA_REMOTE_DATA_ENCRYPTION_KEY_ID: ci-primary-v1
          CAMELLIA_REMOTE_DATA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          CAMELLIA_REMOTE_DATA_ENCRYPTION_V1_KEY_ID: ci-primary-v1
          CAMELLIA_REMOTE_DEVICE_VERIFICATION_TOKEN: ci-device-verification-token-with-sufficient-length
          CAMELLIA_REMOTE_CSRF_TRUSTED_ORIGINS: https://127.0.0.1:21114
          CAMELLIA_REMOTE_API_SERVER: https://127.0.0.1:21114
          CAMELLIA_REMOTE_ID_SERVER: wss://remote.example.test:443
          CAMELLIA_REMOTE_RS_PUB_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          CAMELLIA_REMOTE_SECURE_TLS: "true"
          CAMELLIA_REMOTE_SECURE_HSTS_INCLUDE_SUBDOMAINS: "true"
          CAMELLIA_REMOTE_SECURE_HSTS_PRELOAD: "true"
          CAMELLIA_REMOTE_RATE_LIMIT_ENABLED: "true"
        run: |
          uv run python manage.py check --deploy --fail-level WARNING
          if CAMELLIA_REMOTE_RATE_LIMIT_ENABLED=false uv run python manage.py check >/dev/null 2>&1; then
            echo "production settings unexpectedly allowed request admission to be disabled" >&2
            exit 1
          fi

      - name: Concurrent leased fresh database migration
        env:
          CAMELLIA_REMOTE_MIGRATION_TEST_CONFIRM: ephemeral-empty-database-will-be-migrated
        run: uv run python scripts/test_migration_runner.py

      - name: Verify production PostgreSQL role boundaries
        env:
          CAMELLIA_REMOTE_DATABASE_ROLE_TEST_CONFIRM: ephemeral-database-will-be-mutated
          CAMELLIA_REMOTE_DATABASE_ROLE_TEST_HOST: 127.0.0.1
          CAMELLIA_REMOTE_DATABASE_ROLE_TEST_PORT: "5432"
          CAMELLIA_REMOTE_DATABASE_ROLE_TEST_NAME: camellia_remote_ci
          CAMELLIA_REMOTE_DATABASE_ROLE_TEST_BOOTSTRAP_USER: camellia_remote_ci
          CAMELLIA_REMOTE_DATABASE_ROLE_TEST_BOOTSTRAP_PASSWORD: ci-postgres-password
        run: |
          command -v psql
          uv run python scripts/test_database_roles.py

      - name: Tests
        env:
          COVERAGE_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          COVERAGE_HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ ! "$COVERAGE_BASE_SHA" =~ ^[0-9a-f]{40}$ || "$COVERAGE_BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            COVERAGE_BASE_SHA="$(git rev-parse "${COVERAGE_HEAD_SHA}^")"
          fi
          uv run coverage run --branch -m pytest --create-db
          uv run coverage report
          uv run coverage xml -o "$RUNNER_TEMP/coverage.xml"
          uv run python .github/scripts/ci_coverage_contract.py \
            --coverage-xml "$RUNNER_TEMP/coverage.xml" \
            --base "$COVERAGE_BASE_SHA" \
            --head "$COVERAGE_HEAD_SHA"

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: management-coverage-${{ github.sha }}
          path: ${{ runner.temp }}/coverage.xml
          if-no-files-found: warn
          retention-days: 14

  quality_sqlite:
    name: SQLite debug equivalence
    if: needs.classify.outputs.runtime == 'true'
    needs: [classify, web_client]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CAMELLIA_REMOTE_DEBUG: "true"
      CAMELLIA_REMOTE_SECRET_KEY: ci-only-sqlite-secret-key
      CAMELLIA_REMOTE_ALLOWED_HOSTS: "127.0.0.1,localhost"
      CAMELLIA_REMOTE_CSRF_TRUSTED_ORIGINS: "http://127.0.0.1:21114"
      CAMELLIA_REMOTE_DEVICE_VERIFICATION_TOKEN: ci-device-verification-token-with-sufficient-length
      CAMELLIA_REMOTE_RECORD_VOLUME_RESERVE_BYTES: "0"
      CAMELLIA_REMOTE_RECORD_VOLUME_RESERVE_INODES: "0"
      CAMELLIA_REMOTE_RATE_LIMIT_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Web runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: camellia-remote-web-${{ needs.web_client.outputs.revision }}
          path: static/web_client

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Static analysis
        run: |
          uv run python -m compileall api webui2 camellia_remote_management scripts
          uv run ruff check api webui2 camellia_remote_management scripts

      - name: Run SQLite debug matrix
        env:
          CAMELLIA_REMOTE_SQLITE_DB_PATH: ${{ runner.temp }}/camellia-remote-debug.sqlite3
          CAMELLIA_REMOTE_RECORD_UPLOAD_ROOT: ${{ runner.temp }}/camellia-remote-records
        run: uv run pytest --create-db

  quality_python313:
    name: Python 3.13 lower-bound quality
    if: needs.classify.outputs.runtime == 'true'
    needs: [classify, web_client]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_DB: camellia_remote_ci
          POSTGRES_USER: camellia_remote_ci
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U camellia_remote_ci -d camellia_remote_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CAMELLIA_REMOTE_DEBUG: "true"
      CAMELLIA_REMOTE_SECRET_KEY: ci-only-python313-secret-key
      CAMELLIA_REMOTE_ALLOWED_HOSTS: "127.0.0.1,localhost"
      CAMELLIA_REMOTE_CSRF_TRUSTED_ORIGINS: "http://127.0.0.1:21114"
      CAMELLIA_REMOTE_DATABASE_URL: postgres://camellia_remote_ci:ci-postgres-password@127.0.0.1:5432/camellia_remote_ci
      CAMELLIA_REMOTE_DATABASE_SSLMODE: disable
      CAMELLIA_REMOTE_DEVICE_VERIFICATION_TOKEN: ci-device-verification-token-with-sufficient-length
      CAMELLIA_REMOTE_RECORD_VOLUME_RESERVE_BYTES: "0"
      CAMELLIA_REMOTE_RECORD_VOLUME_RESERVE_INODES: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download Web runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: camellia-remote-web-${{ needs.web_client.outputs.revision }}
          path: static/web_client
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Verify Python 3.13 syntax floor
        run: uv run python -m compileall api webui2 camellia_remote_management scripts
      - name: Run Python 3.13 matrix
        run: uv run pytest --create-db

  container:
    name: Container smoke test
    if: needs.classify.outputs.runtime == 'true'
    needs: [classify, metadata, web_client, quality, quality_python313, quality_sqlite]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      POSTGRES_HARDENING_PROJECT: camellia-remote-pg-${{ github.run_id }}-${{ github.run_attempt }}
      PRODUCTION_COMPOSE_PROJECT: camellia-remote-management-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Web runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: camellia-remote-web-${{ needs.web_client.outputs.revision }}
          path: static/web_client

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: camellia-remote-management-server:ci
          build-args: |
            VERSION=${{ needs.metadata.outputs.version }}
            REVISION=${{ github.sha }}
            SOURCE_REPOSITORY_URL=${{ github.server_url }}/${{ github.repository }}
            WEB_REVISION=${{ needs.web_client.outputs.revision }}
          cache-from: type=gha,scope=remote-management-ci-image
          cache-to: type=gha,scope=remote-management-ci-image,mode=max

      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: camellia-remote-management-server:ci
          version: v0.70.0
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          timeout: 10m0s

      - name: Prepare exact production PostgreSQL images
        env:
          POSTGRES_SCAN_ROOT: ${{ runner.temp }}/postgresql-scans
        run: |
          set -euo pipefail
          mkdir -p "$POSTGRES_SCAN_ROOT"
          database_reference="$(python3 -c 'import json; print(json.load(open("deployment-dependencies.json"))["database"]["reference"])')"
          for architecture in amd64 arm64; do
            image="${database_reference%@*}@$(python3 - "$architecture" <<'PY'
          import json
          import subprocess
          import sys

          architecture = sys.argv[1]
          reference = json.load(open("deployment-dependencies.json"))["database"]["reference"]
          raw = subprocess.check_output(["docker", "buildx", "imagetools", "inspect", "--raw", reference], text=True)
          document = json.loads(raw)
          matches = [
              item["digest"]
              for item in document["manifests"]
              if item.get("platform") == {"os": "linux", "architecture": architecture}
          ]
          if len(matches) != 1:
              raise SystemExit(f"expected one linux/{architecture} PostgreSQL manifest")
          print(matches[0], end="")
          PY
          )"
            docker pull --platform "linux/$architecture" "$image"
            docker save "$image" > "$POSTGRES_SCAN_ROOT/postgres-$architecture.tar"
          done

      - name: Verify production PostgreSQL container boundary
        run: |
          python3 scripts/test_postgres_container_hardening.py \
            --effective \
            --runtime \
            --project-name "$POSTGRES_HARDENING_PROJECT"

      - name: Scan production PostgreSQL amd64 image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/postgresql-scans/postgres-amd64.tar
          version: v0.72.0
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          format: json
          output: ${{ runner.temp }}/postgresql-scans/POSTGRESQL-amd64-VULNERABILITY-SCAN.json
          exit-code: "0"
          timeout: 10m0s

      - name: Scan production PostgreSQL arm64 image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/postgresql-scans/postgres-arm64.tar
          version: v0.72.0
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          format: json
          output: ${{ runner.temp }}/postgresql-scans/POSTGRESQL-arm64-VULNERABILITY-SCAN.json
          exit-code: "0"
          timeout: 10m0s

      - name: Enforce production PostgreSQL vulnerability policy
        run: |
          python3 scripts/deployment_dependencies.py validate-scan \
            "$RUNNER_TEMP/postgresql-scans/POSTGRESQL-amd64-VULNERABILITY-SCAN.json" \
            "$RUNNER_TEMP/postgresql-scans/POSTGRESQL-arm64-VULNERABILITY-SCAN.json"

      - name: Prepare production Compose integration
        run: |
          set -euo pipefail
          python3 scripts/test_production_compose.py \
            --prepare-env \
            --env-file "$RUNNER_TEMP/production-compose.env" \
            --image camellia-remote-management-server:ci \
            --revision "$GITHUB_SHA"
          cat > "$RUNNER_TEMP/docker-wrapper" <<'EOF'
          #!/bin/sh
          exec /usr/bin/docker "$@"
          EOF
          chmod 0755 "$RUNNER_TEMP/docker-wrapper"
          mkdir -p "$RUNNER_TEMP/production-compose-run"

      - name: Verify isolated systemd contract
        run: python3 scripts/test_production_compose.py --systemd-contract

      - name: Run production Compose lifecycle
        run: |
          python3 scripts/test_production_compose.py \
            --run \
            --project-dir "$GITHUB_WORKSPACE" \
            --env-file "$RUNNER_TEMP/production-compose.env" \
            --project-name "$PRODUCTION_COMPOSE_PROJECT" \
            --runtime-dir "$RUNNER_TEMP/production-compose-run" \
            --docker "$RUNNER_TEMP/docker-wrapper" \
            --evidence "$RUNNER_TEMP/production-compose-evidence.json"

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-compose-${{ github.sha }}
          path: |
            ${{ runner.temp }}/production-compose-evidence.json
            ${{ runner.temp }}/postgresql-scans
          if-no-files-found: warn
          retention-days: 14

      - name: Clean up container resources
        if: always()
        run: |
          status=0
          python3 scripts/test_postgres_container_hardening.py \
            --cleanup \
            --project-name "$POSTGRES_HARDENING_PROJECT" || status=$?
          python3 scripts/test_production_compose.py \
            --cleanup \
            --project-name "$PRODUCTION_COMPOSE_PROJECT" \
            --docker "${RUNNER_TEMP}/docker-wrapper" || status=$?
          exit "$status"

  performance_smoke:
    name: Management performance contract smoke
    if: >-
      (github.event_name == 'pull_request' && needs.classify.outputs.runtime == 'true') ||
      github.event_name == 'push'
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Checkout exact control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

      - name: Resolve exact shared contract
        id: contract
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t revisions < candidate/performance/contract.lock
          [[ ${#revisions[@]} -eq 1 && "${revisions[0]}" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=${revisions[0]}" >> "$GITHUB_OUTPUT"

      - name: Checkout immutable performance contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/remote-protocol
          path: performance-contract
          persist-credentials: false
          ref: ${{ steps.contract.outputs.revision }}

      - name: Set up exact Python environments
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          enable-cache: true
          cache-dependency-glob: |
            candidate/uv.lock
            control/uv.lock

      - name: Validate shared contract and prepare exact dependencies
        run: |
          python3 -m unittest -v tools.test_performance_contract
          uv sync --project ../candidate --locked --all-groups
          uv sync --project ../control --locked --all-groups
        working-directory: performance-contract

      - name: Compare authenticated HTTP and database observations
        env:
          CANDIDATE_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          CONTROL_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          PERFORMANCE_ITERATIONS: ${{ github.event_name == 'pull_request' && '5' || '15' }}
          PERFORMANCE_POLICY: ${{ github.event_name == 'pull_request' && 'performance/management-http-devices-v1.json' || 'performance/management-http-devices-v1.scheduled.json' }}
          PERFORMANCE_TIER: ${{ github.event_name == 'pull_request' && 'pr-smoke' || 'scheduled' }}
          PERFORMANCE_WORK_SECONDS: ${{ github.event_name == 'push' && '5' || '' }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0755 control/performance
          install -m 0755 \
            candidate/performance/management_http_observation.py \
            control/performance/management_http_observation.py
          if [[ -n "$PERFORMANCE_WORK_SECONDS" ]]; then
            export CAMELLIA_PERFORMANCE_WORK_SECONDS="$PERFORMANCE_WORK_SECONDS"
          else
            unset CAMELLIA_PERFORMANCE_WORK_SECONDS
          fi
          python3 performance-contract/tools/performance_contract.py collect-pair \
            --repository remote-management-server \
            --control-revision "$CONTROL_REVISION" \
            --candidate-revision "$CANDIDATE_REVISION" \
            --scenario management-http-devices-v1 \
            --tier "$PERFORMANCE_TIER" \
            --runner-class github-ubuntu-24.04-x64 \
            --toolchain python-3.14-django-6 \
            --iterations "$PERFORMANCE_ITERATIONS" --warmups 1 --timeout-seconds 60 \
            --control-output "$RUNNER_TEMP/management-control-performance.json" \
            --candidate-output "$RUNNER_TEMP/management-candidate-performance.json" \
            -- control/.venv/bin/python control/performance/management_http_observation.py \
            ::: candidate/.venv/bin/python candidate/performance/management_http_observation.py
          python3 performance-contract/tools/performance_contract.py compare \
            "$RUNNER_TEMP/management-control-performance.json" \
            "$RUNNER_TEMP/management-candidate-performance.json" \
            "candidate/$PERFORMANCE_POLICY" \
            --output "$RUNNER_TEMP/management-performance-comparison.json"

      - name: Upload bounded performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: management-performance-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/management-control-performance.json
            ${{ runner.temp }}/management-candidate-performance.json
            ${{ runner.temp }}/management-performance-comparison.json
          if-no-files-found: error
          retention-days: 14

  required:
    name: CI / Required
    if: always()
    needs:
      - classify
      - metadata
      - dependency_review
      - release_dependency
      - automation
      - web_client
      - quality
      - quality_python313
      - quality_sqlite
      - container
      - performance_smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce required results
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUNTIME_REQUIRED: ${{ needs.classify.outputs.runtime }}
          AUTOMATION_REQUIRED: ${{ needs.classify.outputs.automation }}
          DEPENDENCIES_CHANGED: ${{ needs.classify.outputs.dependencies }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          METADATA_RESULT: ${{ needs.metadata.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency_review.result }}
          RELEASE_DEPENDENCY_RESULT: ${{ needs.release_dependency.result }}
          RELEASE_DEPENDENCY_REQUIRED: >-
            ${{
              github.event_name == 'pull_request' &&
              github.event.pull_request.base.ref == 'main' &&
              github.event.pull_request.head.ref == 'release/next' &&
              github.event.pull_request.head.repo.full_name == github.repository
            }}
          AUTOMATION_RESULT: ${{ needs.automation.result }}
          WEB_CLIENT_RESULT: ${{ needs.web_client.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          QUALITY_PYTHON313_RESULT: ${{ needs.quality_python313.result }}
          QUALITY_SQLITE_RESULT: ${{ needs.quality_sqlite.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
          PERFORMANCE_SMOKE_RESULT: ${{ needs.performance_smoke.result }}
        run: |
          failure=false
          require_success() {
            local name="$1"
            local result="$2"
            if [[ "$result" != "success" ]]; then
              echo "$name must succeed, got: $result" >&2
              failure=true
            fi
          }

          require_success "change classification" "$CLASSIFY_RESULT"
          require_success "component version validation" "$METADATA_RESULT"
          if [[ "$AUTOMATION_REQUIRED" == "true" ]]; then
            require_success "workflow and synchronization automation" "$AUTOMATION_RESULT"
          fi
          if [[ "$RUNTIME_REQUIRED" == "true" ]]; then
            require_success "Web client build" "$WEB_CLIENT_RESULT"
            require_success "Python and Django quality" "$QUALITY_RESULT"
            require_success "Python 3.13 lower-bound quality" "$QUALITY_PYTHON313_RESULT"
            require_success "SQLite debug equivalence" "$QUALITY_SQLITE_RESULT"
            require_success "container smoke test" "$CONTAINER_RESULT"
          fi
          if [[ "$EVENT_NAME" == "pull_request" && "$DEPENDENCIES_CHANGED" == "true" ]]; then
            require_success "dependency review" "$DEPENDENCY_REVIEW_RESULT"
          fi
          if [[ "$RELEASE_DEPENDENCY_REQUIRED" == "true" ]]; then
            require_success "exact completed client Release" "$RELEASE_DEPENDENCY_RESULT"
          fi
          if [[ "$EVENT_NAME" == "pull_request" && "$RUNTIME_REQUIRED" == "true" ]]; then
            require_success "Management performance contract smoke" "$PERFORMANCE_SMOKE_RESULT"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            require_success "Management performance contract smoke" "$PERFORMANCE_SMOKE_RESULT"
          elif [[ "$PERFORMANCE_SMOKE_RESULT" != "skipped" ]]; then
            echo "Management performance smoke must be skipped outside runtime pull requests and main pushes, got: $PERFORMANCE_SMOKE_RESULT" >&2
            failure=true
          fi
          if [[ "$failure" == "true" ]]; then
            exit 1
          fi
