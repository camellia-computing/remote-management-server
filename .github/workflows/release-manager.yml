name: Release Manager

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] Only successful push CI for exact same-repository main is accepted; trusted main is checked out and the run is revalidated before App use.
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  repository_dispatch:
    types:
      - release-request
  workflow_dispatch:
    inputs:
      version:
        description: Optional exact stable version at or above the automatic minimum
        required: false
        type: string
        default: ""

permissions:
  actions: read # Resolve and bind the proposal to one exact successful main CI run.
  contents: read

concurrency:
  group: release-manager
  cancel-in-progress: false

jobs:
  manage:
    name: Manage
    if: >-
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Resolve exact successful main CI
        id: source
        env:
          DISPATCH_VERSION: ${{ github.event.client_payload.version || '' }}
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version || '' }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event || '' }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        shell: bash
        run: |
          set -euo pipefail
          requested="${INPUT_VERSION:-$DISPATCH_VERSION}"
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            [[ "$WORKFLOW_EVENT" == push ]]
            sha="$WORKFLOW_SHA"
            run_id="$WORKFLOW_RUN_ID"
          else
            [[ "$GITHUB_REF" == refs/heads/main ]] || {
              echo "Manual release management must use main" >&2
              exit 1
            }
            sha="$(git rev-parse HEAD)"
            runs="$(
              gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
                -f head_sha="$sha" -f event=push -f per_page=100
            )"
            run_id="$(
              jq -r --arg sha "$sha" '
                [
                  .workflow_runs[] |
                  select(
                    .head_sha == $sha and
                    .event == "push" and
                    .path == ".github/workflows/ci.yml" and
                    .status == "completed" and
                    .conclusion == "success"
                  )
                ] |
                sort_by(.run_number, .run_attempt, .id) |
                (last.id // empty)
              ' <<< "$runs"
            )"
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ && "$run_id" =~ ^[1-9][0-9]*$ ]] || {
            echo "No exact successful main CI evidence is available" >&2
            exit 1
          }
          {
            echo "requested-version=$requested"
            echo "run-id=$run_id"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"
      - name: Release App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
          permission-contents: write
          permission-issues: write
          permission-metadata: read
          permission-pull-requests: write
      - name: Validate hosted release policy
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_APP_LOGIN: ${{ vars.RELEASE_APP_LOGIN }}
          RELEASE_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: bash .github/scripts/validate-github-release-policy.sh
      - name: Reconcile release state
        env:
          ACTIONS_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_APP_LOGIN: ${{ vars.RELEASE_APP_LOGIN }}
          REQUESTED_VERSION: ${{ steps.source.outputs.requested-version }}
          VALIDATED_SHA: ${{ steps.source.outputs.sha }}
          VALIDATION_RUN_ID: ${{ steps.source.outputs.run-id }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            manage
            --validated-sha "$VALIDATED_SHA"
            --validation-run-id "$VALIDATION_RUN_ID"
          )
          if [[ -n "$REQUESTED_VERSION" ]]; then
            args+=(--requested-version "$REQUESTED_VERSION")
          fi
          python3 .github/scripts/manage-release.py "${args[@]}"
