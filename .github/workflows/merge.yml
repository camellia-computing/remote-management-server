name: Merge

on:
  pull_request_review:
    types:
      - submitted
      - dismissed
  workflow_run: # zizmor: ignore[dangerous-triggers] Trusted main validates the same-repository App-authored release branch, exact head, approval, and CI run before mutation.
    workflows:
      - CI
    types:
      - completed

permissions:
  actions: read # Bind the decision to the exact completed CI run.
  contents: read
  pull-requests: read # Revalidate the managed Release PR head and approval.

concurrency:
  group: release-merge
  cancel-in-progress: false

jobs:
  merge:
    name: Reconcile
    if: >-
      (
        github.event_name == 'pull_request_review' &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.ref == 'release/next' &&
        github.event.pull_request.head.repo.full_name == github.repository
      ) ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_branch == 'release/next' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Release App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
          permission-contents: write
          permission-metadata: read
          permission-pull-requests: read
      - name: Validate hosted release policy
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_APP_LOGIN: ${{ vars.RELEASE_APP_LOGIN }}
          RELEASE_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: bash .github/scripts/validate-github-release-policy.sh
      - name: Merge only the approved exact head
        env:
          ACTIONS_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_APP_LOGIN: ${{ vars.RELEASE_APP_LOGIN }}
        run: python3 .github/scripts/manage-release.py merge
