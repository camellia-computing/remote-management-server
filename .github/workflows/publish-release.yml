name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing managed release tag to recover
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  metadata:
    name: Context
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      control-sha: ${{ steps.source.outputs.control-sha }}
      dockerhub-image: ${{ steps.registries.outputs.dockerhub }}
      ghcr-image: ${{ steps.registries.outputs.ghcr }}
      primary-image: ${{ steps.registries.outputs.primary }}
      sha: ${{ steps.source.outputs.sha }}
      signing-identity: ${{ steps.source.outputs.signing-identity }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Version
        id: version
        run: python3 scripts/release_metadata.py --github-output
      - name: Validate source and workflow identity
        id: source
        env:
          EXPECTED_TAG: ${{ steps.version.outputs.tag }}
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          TRIGGER_REF: ${{ github.ref }}
          TRIGGER_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          [[ "$tag" == "$EXPECTED_TAG" ]]
          identity="https://github.com/$WORKFLOW_REF"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$TRIGGER_REF" == refs/heads/main ]] || {
              echo "Release recovery must use the workflow on main" >&2
              exit 1
            }
            git merge-base --is-ancestor "$WORKFLOW_SHA" origin/main
            expected="https://github.com/$GITHUB_REPOSITORY/.github/workflows/publish-release.yml@refs/heads/main"
          else
            [[ "$GITHUB_REF_TYPE" == tag && "$TRIGGER_REF" == "refs/tags/$tag" ]]
            expected="https://github.com/$GITHUB_REPOSITORY/.github/workflows/publish-release.yml@refs/tags/$tag"
          fi
          [[ "$identity" == "$expected" ]] || {
            echo "Release workflow identity does not match its trusted trigger" >&2
            exit 1
          }
          sha="$(git rev-list -n 1 "$tag")"
          [[ "$sha" =~ ^[0-9a-f]{40}$ && "$(git rev-parse HEAD)" == "$sha" ]]
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
            [[ "$TRIGGER_SHA" == "$sha" ]]
          fi
          git merge-base --is-ancestor "$sha" origin/main
          {
            echo "control-sha=$WORKFLOW_SHA"
            echo "sha=$sha"
            echo "signing-identity=$identity"
          } >> "$GITHUB_OUTPUT"
      - name: Trusted registry resolver
        shell: bash
        run: |
          git show "$GITHUB_WORKFLOW_SHA:.github/scripts/resolve-container-registries.sh" \
            > "$RUNNER_TEMP/resolve-container-registries.sh"
          chmod 700 "$RUNNER_TEMP/resolve-container-registries.sh"
      - name: Reviewed registry targets
        id: registries
        env:
          CONTAINER_REGISTRY_MAP: ${{ vars.CONTAINER_REGISTRY_MAP }}
          LOGICAL_REPOSITORY_ID: remote-management
        run: bash "$RUNNER_TEMP/resolve-container-registries.sh"

  authorize:
    name: Authorize
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read # Bind authorization to the exact successful validation run.
      contents: read
      pull-requests: read # Revalidate the managed Release PR and exact head.
    outputs:
      release-digest: ${{ steps.release.outputs.release-digest }}
      release-draft: ${{ steps.release.outputs.release-draft }}
      release-id: ${{ steps.release.outputs.release-id }}
      release-pr-number: ${{ steps.release.outputs.release-pr-number }}
      validation-run-id: ${{ steps.release.outputs.validation-run-id }}
    steps:
      - name: Release App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
          permission-contents: read
          permission-metadata: read
          permission-pull-requests: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: ${{ needs.metadata.outputs.tag }}
      - name: Trusted authorization control
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            manage-release.py \
            validate-github-release-policy.sh
          do
            git show "$GITHUB_WORKFLOW_SHA:.github/scripts/$script" \
              > "$RUNNER_TEMP/$script"
            chmod 700 "$RUNNER_TEMP/$script"
          done
      - name: Validate hosted release policy
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_APP_LOGIN: ${{ vars.RELEASE_APP_LOGIN }}
          RELEASE_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: bash "$RUNNER_TEMP/validate-github-release-policy.sh"
      - name: Managed release
        id: release
        env:
          ACTIONS_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_APP_LOGIN: ${{ vars.RELEASE_APP_LOGIN }}
          RELEASE_SHA: ${{ needs.metadata.outputs.sha }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          python3 "$RUNNER_TEMP/manage-release.py" authorize \
            --version "$VERSION" \
            --sha "$RELEASE_SHA" \
            --tag "$RELEASE_TAG"

  evidence:
    name: Freeze candidate
    if: ${{ needs.authorize.outputs.release-draft == 'true' }}
    needs: [metadata, authorize]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      actions: read # Read only the exact CI Web runtime and dependency evidence.
      attestations: write # Record SBOM and provenance for the frozen image digest.
      contents: read
      id-token: write # Mint the short-lived identity used by GitHub attestations.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.metadata.outputs.tag }}
      - name: Trusted evidence control
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            build-container-release-evidence.py \
            resolve-remote-client-release.py \
            validate-release-evidence.py
          do
            git show "$GITHUB_WORKFLOW_SHA:.github/scripts/$script" \
              > "$RUNNER_TEMP/$script"
            chmod 700 "$RUNNER_TEMP/$script"
          done
      - name: Resolve exact completed client dependency
        id: client
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_APP_LOGIN: ${{ vars.RELEASE_APP_LOGIN }}
          REMOTE_REPOSITORY_MAP: ${{ vars.REMOTE_REPOSITORY_MAP }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          locked_commit="$(scripts/web_client_revision.sh)"
          PYTHONPATH="$RUNNER_TEMP" python3 \
            "$RUNNER_TEMP/resolve-remote-client-release.py" \
            --repository-map "$REMOTE_REPOSITORY_MAP" \
            --owner "$GITHUB_REPOSITORY_OWNER" \
            --current-repository "$GITHUB_REPOSITORY" \
            --release-app-login "$RELEASE_APP_LOGIN" \
            --commit "$locked_commit" \
            --output-directory release-assets \
            --github-output "$GITHUB_OUTPUT"
      - name: Download exact CI-built Web runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: camellia-remote-web-${{ steps.client.outputs.commit }}
          path: static/web_client
          github-token: ${{ github.token }}
          run-id: ${{ needs.authorize.outputs.validation-run-id }}
      - name: Verify frozen Web runtime
        env:
          EXPECTED_REVISION: ${{ steps.client.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          revision_file="static/web_client/.source_revision"
          [[ -f "$revision_file" && ! -L "$revision_file" ]]
          [[ "$(tr -d '\r\n' < "$revision_file")" == "$EXPECTED_REVISION clean" ]]
          required_files=(
            flutter_bootstrap.js
            main.dart.js
            manifest.json
            canvaskit/canvaskit.wasm
            js/dist/web_bridge.js
          )
          for required_file in "${required_files[@]}"; do
            [[ -f "static/web_client/$required_file" ]]
          done
          [[ -z "$(find static/web_client -type l -print -quit)" ]]
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build immutable OCI layout
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=${{ runner.temp }}/release-image.oci.tar
          tags: remote-management-service:v${{ needs.metadata.outputs.version }}
          build-args: |
            VERSION=${{ needs.metadata.outputs.version }}
            REVISION=${{ needs.metadata.outputs.sha }}
            SOURCE_REPOSITORY_URL=${{ github.server_url }}/${{ github.repository }}
            WEB_REVISION=${{ steps.client.outputs.commit }}
          provenance: mode=max
          sbom: true
      - name: Resolve exact platform digests
        id: image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_SHA: ${{ needs.metadata.outputs.sha }}
          VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/release-image-layout"
          tar -xf "$RUNNER_TEMP/release-image.oci.tar" \
            -C "$RUNNER_TEMP/release-image-layout"
          index="$RUNNER_TEMP/release-image-layout/index.json"
          test "$(jq '[.manifests[].digest] | unique | length' "$index")" = 1
          test "$(jq -r '.manifests[0].digest' "$index")" = "$IMAGE_DIGEST"
          manifest="$RUNNER_TEMP/release-image-layout/blobs/sha256/${IMAGE_DIGEST#sha256:}"
          amd64_digest=""
          arm64_digest=""
          for architecture in amd64 arm64; do
            platform_digest="$(
              jq -er --arg architecture "$architecture" '
                [
                  .manifests[] |
                  select(
                    .platform.os == "linux" and
                    .platform.architecture == $architecture
                  ) |
                  .digest
                ] |
                if length == 1 then .[0] else error("platform mismatch") end
              ' "$manifest"
            )"
            echo "$architecture-digest=$platform_digest" >> "$GITHUB_OUTPUT"
            if [[ "$architecture" == amd64 ]]; then
              amd64_digest="$platform_digest"
            else
              arm64_digest="$platform_digest"
            fi
          done
          jq -n \
            --arg digest "$IMAGE_DIGEST" \
            --arg amd64 "$amd64_digest" \
            --arg arm64 "$arm64_digest" \
            --arg commit "$RELEASE_SHA" \
            --arg version "$VERSION" '{
              schema_version: 1,
              image: "remote-management-service",
              version: $version,
              source_commit: $commit,
              digest: $digest,
              platforms: [
                {platform:"linux",architecture:"amd64",digest:$amd64},
                {platform:"linux",architecture:"arm64",digest:$arm64}
              ]
            }' > release-assets/release-image-metadata.json
      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/release-image.oci.tar
          version: v0.72.0
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: json
          output: release-assets/VULNERABILITY-SCAN.json
          exit-code: "1"
          timeout: 10m0s
      - name: SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: oci-archive:${{ runner.temp }}/release-image.oci.tar
          format: spdx-json
          output-file: release-assets/SBOM.spdx.json
          syft-version: v1.50.0
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false
      - name: Provenance
        id: provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ needs.metadata.outputs.primary-image }}
          subject-digest: ${{ steps.build.outputs.digest }}
      - name: SBOM attestation
        id: sbom-attestation
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ needs.metadata.outputs.primary-image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: release-assets/SBOM.spdx.json
      - name: Freeze release evidence
        env:
          AMD64_DIGEST: ${{ steps.image.outputs.amd64-digest }}
          ARM64_DIGEST: ${{ steps.image.outputs.arm64-digest }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          RELEASE_SHA: ${{ needs.metadata.outputs.sha }}
          SBOM_ATTESTATION_BUNDLE: ${{ steps.sbom-attestation.outputs.bundle-path }}
          VALIDATION_RUN_ID: ${{ needs.authorize.outputs.validation-run-id }}
          VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          cp -- "$PROVENANCE_BUNDLE" \
            release-assets/PROVENANCE.intoto.jsonl
          cp -- "$SBOM_ATTESTATION_BUNDLE" \
            release-assets/SBOM-ATTESTATION.intoto.jsonl
          PYTHONPATH="$RUNNER_TEMP" python3 \
            "$RUNNER_TEMP/build-container-release-evidence.py" freeze \
            --repository remote-management \
            --image remote-management-service \
            --version "$VERSION" \
            --commit "$RELEASE_SHA" \
            --validation-run-id "$VALIDATION_RUN_ID" \
            --digest "$IMAGE_DIGEST" \
            --platform "linux/amd64=$AMD64_DIGEST" \
            --platform "linux/arm64=$ARM64_DIGEST" \
            --sbom release-assets/SBOM.spdx.json \
            --provenance release-assets/PROVENANCE.intoto.jsonl \
            --dependencies release-assets/dependencies.json \
            --output release-assets/frozen-release-evidence.json
          mkdir frozen-input
          mv release-assets frozen-input/
          mv "$RUNNER_TEMP/release-image.oci.tar" frozen-input/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: remote-management-${{ needs.metadata.outputs.version }}-frozen
          path: frozen-input
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    if: >-
      always() &&
      needs.metadata.result == 'success' &&
      needs.authorize.result == 'success' &&
      (
        needs.authorize.outputs.release-draft == 'false' ||
        needs.evidence.result == 'success'
      )
    needs: [metadata, authorize, evidence]
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 75
    permissions:
      actions: read # Download only the exact frozen release candidate.
      attestations: read # Verify the frozen SBOM and provenance before publication.
      contents: read
      id-token: write # Mint the short-lived keyless Cosign publication identity.
      packages: write # Publish configured GHCR aliases for the verified digest.
      pull-requests: read # Revalidate the managed Release PR at the approval boundary.
    steps:
      - name: Release App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
          permission-contents: write
          permission-issues: write
          permission-metadata: read
          permission-pull-requests: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: ${{ needs.metadata.outputs.tag }}
      - name: Trusted publication control
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            build-container-release-evidence.py \
            manage-release.py \
            publish-container-release.sh \
            reconcile-container-latest.sh \
            validate-release-evidence.py \
            verify-release-image.sh
          do
            git show "$GITHUB_WORKFLOW_SHA:.github/scripts/$script" \
              > "$RUNNER_TEMP/$script"
            chmod 700 "$RUNNER_TEMP/$script"
          done
      - name: Reauthorize
        id: release
        env:
          ACTIONS_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_APP_LOGIN: ${{ vars.RELEASE_APP_LOGIN }}
          RELEASE_SHA: ${{ needs.metadata.outputs.sha }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          python3 "$RUNNER_TEMP/manage-release.py" authorize \
            --version "$VERSION" \
            --sha "$RELEASE_SHA" \
            --tag "$RELEASE_TAG"
      - name: Download frozen candidate
        if: ${{ needs.authorize.outputs.release-draft == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: remote-management-${{ needs.metadata.outputs.version }}-frozen
          path: frozen-input
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.3
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Validate Docker Hub credentials
        if: ${{ needs.metadata.outputs.dockerhub-image != '' }}
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          [[ -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]] || {
            echo "Docker Hub is configured but its credential pair is missing" >&2
            exit 1
          }
      - name: GHCR login
        if: ${{ needs.metadata.outputs.ghcr-image != '' }}
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
      - name: Docker Hub login
        if: ${{ needs.metadata.outputs.dockerhub-image != '' }}
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish or verify exact release
        env:
          ACTIONS_TOKEN: ${{ github.token }}
          ASSETS_DIRECTORY: frozen-input/release-assets
          DOCKERHUB_IMAGE: ${{ needs.metadata.outputs.dockerhub-image }}
          GHCR_IMAGE: ${{ needs.metadata.outputs.ghcr-image }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          LOGICAL_IMAGE_ID: remote-management-service
          LOGICAL_REPOSITORY_ID: remote-management
          OCI_ARCHIVE: frozen-input/release-image.oci.tar
          PRIMARY_IMAGE: ${{ needs.metadata.outputs.primary-image }}
          RECORDED_DIGEST: ${{ steps.release.outputs.release-digest }}
          RELEASE_APP_LOGIN: ${{ vars.RELEASE_APP_LOGIN }}
          RELEASE_ID: ${{ steps.release.outputs.release-id }}
          RELEASE_PR_NUMBER: ${{ steps.release.outputs.release-pr-number }}
          RELEASE_SHA: ${{ needs.metadata.outputs.sha }}
          RELEASE_SIGNING_IDENTITY: ${{ needs.metadata.outputs.signing-identity }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_TITLE: Camellia Remote Management Server
          RUNTIME_VERIFY_SCRIPT: ${{ runner.temp }}/verify-release-image.sh
          VERIFY_PUBLISHED_ONLY: ${{ needs.authorize.outputs.release-draft == 'false' }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: bash "$RUNNER_TEMP/publish-container-release.sh"
      - name: Complete publication
        env:
          ACTIONS_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_APP_LOGIN: ${{ vars.RELEASE_APP_LOGIN }}
          RELEASE_SHA: ${{ needs.metadata.outputs.sha }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          python3 "$RUNNER_TEMP/manage-release.py" complete \
            --version "$VERSION" \
            --sha "$RELEASE_SHA" \
            --tag "$RELEASE_TAG"
      - name: Reconcile highest completed stable release
        id: latest
        env:
          ACTIONS_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_APP_LOGIN: ${{ vars.RELEASE_APP_LOGIN }}
          RELEASE_SHA: ${{ needs.metadata.outputs.sha }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          python3 "$RUNNER_TEMP/manage-release.py" reconcile-latest \
            --version "$VERSION" \
            --sha "$RELEASE_SHA" \
            --tag "$RELEASE_TAG"
      - name: Reconcile registry latest aliases
        env:
          DOCKERHUB_IMAGE: ${{ needs.metadata.outputs.dockerhub-image }}
          GHCR_IMAGE: ${{ needs.metadata.outputs.ghcr-image }}
          LATEST_DIGEST: ${{ steps.latest.outputs.latest-digest }}
          OWNS_LATEST: ${{ steps.latest.outputs.owns-latest }}
        run: bash "$RUNNER_TEMP/reconcile-container-latest.sh"
