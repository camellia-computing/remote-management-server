name: Main

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: remote-management-main
  cancel-in-progress: true

jobs:
  policy:
    name: Policy
    if: ${{ vars.RELEASE_APP_CLIENT_ID != '' || vars.RELEASE_APP_LOGIN != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release policy token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v2.2.1
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
          permission-contents: write
          permission-metadata: read
      - name: Validate hosted repository policy
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_APP_LOGIN: ${{ vars.RELEASE_APP_LOGIN }}
          RELEASE_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: bash .github/scripts/validate-github-release-policy.sh
