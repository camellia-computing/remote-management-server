x-database-client: &database-client
  image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
  pull_policy: always
  entrypoint: []
  user: "70:70"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=32m,mode=1777
  networks:
    - backend
  restart: "no"
  cpus: "${CAMELLIA_REMOTE_DATABASE_CLIENT_CPUS:-0.50}"
  cpu_shares: ${CAMELLIA_REMOTE_DATABASE_CLIENT_CPU_SHARES:-128}
  mem_limit: ${CAMELLIA_REMOTE_DATABASE_CLIENT_MEMORY_LIMIT:-256m}
  mem_reservation: ${CAMELLIA_REMOTE_DATABASE_CLIENT_MEMORY_RESERVATION:-128m}
  pids_limit: ${CAMELLIA_REMOTE_DATABASE_CLIENT_PIDS_LIMIT:-64}
  ulimits:
    nofile:
      soft: ${CAMELLIA_REMOTE_DATABASE_CLIENT_NOFILE_SOFT:-1024}
      hard: ${CAMELLIA_REMOTE_DATABASE_CLIENT_NOFILE_HARD:-2048}
    nproc: ${CAMELLIA_REMOTE_DATABASE_CLIENT_NPROC:-128}

services:
  postgres:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_DB: ${CAMELLIA_REMOTE_DATABASE_NAME:-camellia_remote}
      POSTGRES_USER: ${CAMELLIA_REMOTE_DATABASE_BOOTSTRAP_USER:?Set the existing or new cluster bootstrap superuser}
      POSTGRES_PASSWORD: ${CAMELLIA_REMOTE_DATABASE_BOOTSTRAP_PASSWORD:?Set the bootstrap password}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8
      CAMELLIA_REMOTE_DATABASE_PROBE_USER: ${CAMELLIA_REMOTE_DATABASE_PROBE_USER:?Set the probe role}
      CAMELLIA_REMOTE_DATABASE_PROBE_PASSWORD: ${CAMELLIA_REMOTE_DATABASE_PROBE_PASSWORD:?Set the probe password}
    volumes:
      - postgres-data:/var/lib/postgresql
    # Normal steady state is PostgreSQL + management (3 CPUs/3 GiB). The
    # controller stops management before migration; backup is separately
    # capped and never runs concurrently with migration.
    cpus: "${CAMELLIA_REMOTE_POSTGRES_CPUS:-2.0}"
    cpu_shares: ${CAMELLIA_REMOTE_POSTGRES_CPU_SHARES:-1024}
    mem_limit: ${CAMELLIA_REMOTE_POSTGRES_MEMORY_LIMIT:-2g}
    mem_reservation: ${CAMELLIA_REMOTE_POSTGRES_MEMORY_RESERVATION:-1g}
    pids_limit: ${CAMELLIA_REMOTE_POSTGRES_PIDS_LIMIT:-256}
    oom_score_adj: ${CAMELLIA_REMOTE_POSTGRES_OOM_SCORE_ADJ:--500}
    blkio_config:
      weight: ${CAMELLIA_REMOTE_POSTGRES_BLKIO_WEIGHT:-500}
    shm_size: ${CAMELLIA_REMOTE_POSTGRES_SHM_SIZE:-256m}
    ulimits:
      nofile:
        soft: ${CAMELLIA_REMOTE_POSTGRES_NOFILE_SOFT:-8192}
        hard: ${CAMELLIA_REMOTE_POSTGRES_NOFILE_HARD:-16384}
      nproc: ${CAMELLIA_REMOTE_POSTGRES_NPROC:-512}
    command:
      - postgres
      - -c
      - max_connections=${CAMELLIA_REMOTE_POSTGRES_MAX_CONNECTIONS:-128}
      - -c
      - shared_buffers=${CAMELLIA_REMOTE_POSTGRES_SHARED_BUFFERS:-512MB}
      - -c
      - work_mem=${CAMELLIA_REMOTE_POSTGRES_WORK_MEM:-4MB}
      - -c
      - maintenance_work_mem=${CAMELLIA_REMOTE_POSTGRES_MAINTENANCE_WORK_MEM:-128MB}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$${CAMELLIA_REMOTE_DATABASE_PROBE_PASSWORD}"
          psql --no-psqlrc --host 127.0.0.1
          --username "$${CAMELLIA_REMOTE_DATABASE_PROBE_USER}"
          --dbname "$${POSTGRES_DB}" --tuples-only --no-align
          --command "SELECT 1" | grep -Fxq 1
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - backend

  database-bootstrap:
    <<: *database-client
    profiles:
      - database-operations
    environment:
      PGHOST: ${CAMELLIA_REMOTE_DATABASE_HOST:-postgres}
      PGPORT: ${CAMELLIA_REMOTE_DATABASE_PORT:-5432}
      PGDATABASE: ${CAMELLIA_REMOTE_DATABASE_NAME:-camellia_remote}
      PGUSER: ${CAMELLIA_REMOTE_DATABASE_BOOTSTRAP_USER:?Set the existing or new cluster bootstrap superuser}
      PGPASSWORD: ${CAMELLIA_REMOTE_DATABASE_BOOTSTRAP_PASSWORD:?Set the bootstrap password}
      PGSSLMODE: ${CAMELLIA_REMOTE_DATABASE_SSLMODE:-disable}
      PGOPTIONS: >-
        -c statement_timeout=${CAMELLIA_REMOTE_DATABASE_MIGRATION_STATEMENT_TIMEOUT_MS:-1800000}
        -c lock_timeout=${CAMELLIA_REMOTE_DATABASE_MIGRATION_LOCK_TIMEOUT_MS:-300000}
        -c idle_in_transaction_session_timeout=${CAMELLIA_REMOTE_DATABASE_MIGRATION_IDLE_TRANSACTION_TIMEOUT_MS:-120000}
      CAMELLIA_REMOTE_DATABASE_MIGRATION_USER: ${CAMELLIA_REMOTE_DATABASE_MIGRATION_USER:?Set the migration owner role}
      CAMELLIA_REMOTE_DATABASE_MIGRATION_PASSWORD: ${CAMELLIA_REMOTE_DATABASE_MIGRATION_PASSWORD:?Set the migration password}
      CAMELLIA_REMOTE_DATABASE_RUNTIME_USER: ${CAMELLIA_REMOTE_DATABASE_RUNTIME_USER:?Set the runtime role}
      CAMELLIA_REMOTE_DATABASE_RUNTIME_PASSWORD: ${CAMELLIA_REMOTE_DATABASE_RUNTIME_PASSWORD:?Set the runtime password}
      CAMELLIA_REMOTE_DATABASE_BACKUP_USER: ${CAMELLIA_REMOTE_DATABASE_BACKUP_USER:?Set the backup role}
      CAMELLIA_REMOTE_DATABASE_BACKUP_PASSWORD: ${CAMELLIA_REMOTE_DATABASE_BACKUP_PASSWORD:?Set the backup password}
      CAMELLIA_REMOTE_DATABASE_PROBE_USER: ${CAMELLIA_REMOTE_DATABASE_PROBE_USER:?Set the probe role}
      CAMELLIA_REMOTE_DATABASE_PROBE_PASSWORD: ${CAMELLIA_REMOTE_DATABASE_PROBE_PASSWORD:?Set the probe password}
    volumes:
      - ./deploy/bootstrap-postgres-roles.sh:/usr/local/bin/bootstrap-postgres-roles.sh:ro
    command: ["/bin/sh", "/usr/local/bin/bootstrap-postgres-roles.sh"]

  database-backup:
    <<: *database-client
    profiles:
      - database-operations
    # These limits are attached to the pg_dump/pg_restore process by Docker's
    # container cgroup. Host-side systemd priority on the Docker CLI cannot
    # constrain a process launched by the Docker daemon.
    cpus: "1.0"
    cpu_shares: 256
    mem_limit: 512m
    mem_reservation: 256m
    pids_limit: 64
    oom_score_adj: 500
    blkio_config:
      weight: 100
    environment:
      PGHOST: ${CAMELLIA_REMOTE_DATABASE_HOST:-postgres}
      PGPORT: ${CAMELLIA_REMOTE_DATABASE_PORT:-5432}
      PGDATABASE: ${CAMELLIA_REMOTE_DATABASE_NAME:-camellia_remote}
      PGUSER: ${CAMELLIA_REMOTE_DATABASE_BACKUP_USER:?Set the backup role}
      PGPASSWORD: ${CAMELLIA_REMOTE_DATABASE_BACKUP_PASSWORD:?Set the backup password}
      PGSSLMODE: ${CAMELLIA_REMOTE_DATABASE_SSLMODE:-disable}
      PGOPTIONS: >-
        -c statement_timeout=${CAMELLIA_REMOTE_DATABASE_BACKUP_STATEMENT_TIMEOUT_MS:-2400000}
        -c lock_timeout=${CAMELLIA_REMOTE_DATABASE_BACKUP_LOCK_TIMEOUT_MS:-30000}
        -c idle_in_transaction_session_timeout=${CAMELLIA_REMOTE_DATABASE_BACKUP_IDLE_TRANSACTION_TIMEOUT_MS:-60000}
    command: ["psql", "--version"]

  database-restore:
    <<: *database-client
    profiles:
      - database-operations
    environment:
      PGHOST: ${CAMELLIA_REMOTE_DATABASE_HOST:-postgres}
      PGPORT: ${CAMELLIA_REMOTE_DATABASE_PORT:-5432}
      PGDATABASE: ${CAMELLIA_REMOTE_DATABASE_NAME:-camellia_remote}
      PGUSER: ${CAMELLIA_REMOTE_DATABASE_MIGRATION_USER:?Set the migration owner role}
      PGPASSWORD: ${CAMELLIA_REMOTE_DATABASE_MIGRATION_PASSWORD:?Set the migration password}
      PGSSLMODE: ${CAMELLIA_REMOTE_DATABASE_SSLMODE:-disable}
      PGOPTIONS: >-
        -c statement_timeout=${CAMELLIA_REMOTE_DATABASE_MIGRATION_STATEMENT_TIMEOUT_MS:-1800000}
        -c lock_timeout=${CAMELLIA_REMOTE_DATABASE_MIGRATION_LOCK_TIMEOUT_MS:-300000}
        -c idle_in_transaction_session_timeout=${CAMELLIA_REMOTE_DATABASE_MIGRATION_IDLE_TRANSACTION_TIMEOUT_MS:-120000}
    command: ["psql", "--version"]

  database-probe:
    <<: *database-client
    profiles:
      - database-operations
    environment:
      PGHOST: ${CAMELLIA_REMOTE_DATABASE_HOST:-postgres}
      PGPORT: ${CAMELLIA_REMOTE_DATABASE_PORT:-5432}
      PGDATABASE: ${CAMELLIA_REMOTE_DATABASE_NAME:-camellia_remote}
      PGUSER: ${CAMELLIA_REMOTE_DATABASE_PROBE_USER:?Set the probe role}
      PGPASSWORD: ${CAMELLIA_REMOTE_DATABASE_PROBE_PASSWORD:?Set the probe password}
      PGSSLMODE: ${CAMELLIA_REMOTE_DATABASE_SSLMODE:-disable}
      PGCONNECT_TIMEOUT: ${CAMELLIA_REMOTE_DATABASE_CONNECT_TIMEOUT:-10}
      PGOPTIONS: >-
        -c statement_timeout=5000
        -c lock_timeout=1000
        -c idle_in_transaction_session_timeout=5000
    command: ["psql", "--no-psqlrc", "--tuples-only", "--no-align", "--command", "SELECT 1"]

  migrate:
    <<: *application
    environment:
      <<: *application-environment
      CAMELLIA_REMOTE_DATABASE_USER: ${CAMELLIA_REMOTE_DATABASE_MIGRATION_USER:?Set the migration owner role}
      CAMELLIA_REMOTE_DATABASE_PASSWORD: ${CAMELLIA_REMOTE_DATABASE_MIGRATION_PASSWORD:?Set the migration password}
      CAMELLIA_REMOTE_DATABASE_OPERATION_PROFILE: MIGRATION
      CAMELLIA_REMOTE_MIGRATION_ACTOR: ${CAMELLIA_REMOTE_MIGRATION_ACTOR:-compose-controller}
      CAMELLIA_REMOTE_REQUIRE_CGROUP_BUDGET: "true"
    cpus: "${CAMELLIA_REMOTE_MIGRATION_CPUS:-2.0}"
    cpu_shares: ${CAMELLIA_REMOTE_MIGRATION_CPU_SHARES:-512}
    mem_limit: ${CAMELLIA_REMOTE_MIGRATION_MEMORY_LIMIT:-1g}
    mem_reservation: ${CAMELLIA_REMOTE_MIGRATION_MEMORY_RESERVATION:-512m}
    pids_limit: ${CAMELLIA_REMOTE_MIGRATION_PIDS_LIMIT:-256}
    oom_score_adj: ${CAMELLIA_REMOTE_MIGRATION_OOM_SCORE_ADJ:-250}
    blkio_config:
      weight: ${CAMELLIA_REMOTE_MIGRATION_BLKIO_WEIGHT:-200}
    ulimits:
      nofile:
        soft: ${CAMELLIA_REMOTE_MIGRATION_NOFILE_SOFT:-4096}
        hard: ${CAMELLIA_REMOTE_MIGRATION_NOFILE_HARD:-8192}
      nproc: ${CAMELLIA_REMOTE_MIGRATION_NPROC:-256}
    command: ["python", "manage.py", "migrate_with_lease", "--noinput"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  management:
    <<: *application
    environment:
      <<: *application-environment
      CAMELLIA_REMOTE_DATABASE_USER: ${CAMELLIA_REMOTE_DATABASE_RUNTIME_USER:?Set the runtime role}
      CAMELLIA_REMOTE_DATABASE_PASSWORD: ${CAMELLIA_REMOTE_DATABASE_RUNTIME_PASSWORD:?Set the runtime password}
      CAMELLIA_REMOTE_DATABASE_OPERATION_PROFILE: RUNTIME
      CAMELLIA_REMOTE_BIND_HOST: 0.0.0.0
      CAMELLIA_REMOTE_BIND_PORT: "21114"
      CAMELLIA_REMOTE_RUN_MIGRATIONS: "false"
      CAMELLIA_REMOTE_GUNICORN_FORWARDED_ALLOW_IPS: ${CAMELLIA_REMOTE_GUNICORN_FORWARDED_ALLOW_IPS:-127.0.0.1}
      CAMELLIA_REMOTE_GUNICORN_WORKERS: ${CAMELLIA_REMOTE_GUNICORN_WORKERS:-2}
      CAMELLIA_REMOTE_GUNICORN_THREADS: ${CAMELLIA_REMOTE_GUNICORN_THREADS:-2}
      CAMELLIA_REMOTE_GUNICORN_TIMEOUT_SECONDS: ${CAMELLIA_REMOTE_GUNICORN_TIMEOUT_SECONDS:-75}
      CAMELLIA_REMOTE_GUNICORN_GRACEFUL_TIMEOUT_SECONDS: ${CAMELLIA_REMOTE_GUNICORN_GRACEFUL_TIMEOUT_SECONDS:-30}
      CAMELLIA_REMOTE_DOCKER_STOP_GRACE_PERIOD_SECONDS: ${CAMELLIA_REMOTE_DOCKER_STOP_GRACE_PERIOD_SECONDS:-45}
      CAMELLIA_REMOTE_GUNICORN_KEEP_ALIVE_SECONDS: ${CAMELLIA_REMOTE_GUNICORN_KEEP_ALIVE_SECONDS:-5}
      CAMELLIA_REMOTE_GUNICORN_MAX_REQUESTS: ${CAMELLIA_REMOTE_GUNICORN_MAX_REQUESTS:-1000}
      CAMELLIA_REMOTE_GUNICORN_MAX_REQUESTS_JITTER: ${CAMELLIA_REMOTE_GUNICORN_MAX_REQUESTS_JITTER:-100}
      CAMELLIA_REMOTE_REQUEST_DEADLINE_SECONDS: ${CAMELLIA_REMOTE_REQUEST_DEADLINE_SECONDS:-65}
      CAMELLIA_REMOTE_REQUIRE_CGROUP_BUDGET: "true"
    cpus: "${CAMELLIA_REMOTE_MANAGEMENT_CPUS:-2.0}"
    cpu_shares: ${CAMELLIA_REMOTE_MANAGEMENT_CPU_SHARES:-1024}
    mem_limit: ${CAMELLIA_REMOTE_MANAGEMENT_MEMORY_LIMIT:-1g}
    mem_reservation: ${CAMELLIA_REMOTE_MANAGEMENT_MEMORY_RESERVATION:-512m}
    pids_limit: ${CAMELLIA_REMOTE_MANAGEMENT_PIDS_LIMIT:-256}
    oom_score_adj: ${CAMELLIA_REMOTE_MANAGEMENT_OOM_SCORE_ADJ:-250}
    blkio_config:
      weight: ${CAMELLIA_REMOTE_MANAGEMENT_BLKIO_WEIGHT:-500}
    ulimits:
      nofile:
        soft: ${CAMELLIA_REMOTE_MANAGEMENT_NOFILE_SOFT:-4096}
        hard: ${CAMELLIA_REMOTE_MANAGEMENT_NOFILE_HARD:-8192}
      nproc: ${CAMELLIA_REMOTE_MANAGEMENT_NPROC:-256}
    volumes:
      - recordings:/app/records
    ports:
      - 127.0.0.1:${CAMELLIA_REMOTE_API_BIND_PORT:-21114}:21114
    networks:
      - backend
      - edge
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          request = urllib.request.Request("http://127.0.0.1:21114/health/ready", headers={"X-Forwarded-Proto": "https"});
          response = urllib.request.urlopen(request, timeout=3);
          assert response.status == 200 and json.load(response)["status"] == "ready"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: ${CAMELLIA_REMOTE_DOCKER_STOP_GRACE_PERIOD_SECONDS:-45}s
    restart: "no"

networks:
  backend:
    internal: true
  edge:

volumes:
  postgres-data:
  recordings:
