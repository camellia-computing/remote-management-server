    CAMELLIA_REMOTE_OIDC_ISSUER: ${CAMELLIA_REMOTE_OIDC_ISSUER:-}
    CAMELLIA_REMOTE_OIDC_CLIENT_ID: ${CAMELLIA_REMOTE_OIDC_CLIENT_ID:-}
    CAMELLIA_REMOTE_OIDC_CLIENT_SECRET: ${CAMELLIA_REMOTE_OIDC_CLIENT_SECRET:-}
    CAMELLIA_REMOTE_OIDC_REDIRECT_URI: ${CAMELLIA_REMOTE_OIDC_REDIRECT_URI:-}
    CAMELLIA_REMOTE_OIDC_ALLOWED_HOSTS: ${CAMELLIA_REMOTE_OIDC_ALLOWED_HOSTS:-}
    CAMELLIA_REMOTE_OIDC_SCOPE: ${CAMELLIA_REMOTE_OIDC_SCOPE:-openid email profile}
    CAMELLIA_REMOTE_OIDC_HTTP_TIMEOUT_SECONDS: ${CAMELLIA_REMOTE_OIDC_HTTP_TIMEOUT_SECONDS:-10}
    CAMELLIA_REMOTE_OIDC_AUTO_PROVISION: ${CAMELLIA_REMOTE_OIDC_AUTO_PROVISION:-false}
    CAMELLIA_REMOTE_OIDC_AUTO_PROVISION_EMAIL_DOMAINS: ${CAMELLIA_REMOTE_OIDC_AUTO_PROVISION_EMAIL_DOMAINS:-}
