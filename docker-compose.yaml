name: camellia-remote-management

x-application: &application
  image: ${CAMELLIA_REMOTE_MANAGEMENT_IMAGE:?Pin the released image by sha256 digest}
  pull_policy: always
  environment: &application-environment
    TZ: ${CAMELLIA_REMOTE_TZ:-Asia/Singapore}
    CAMELLIA_REMOTE_TIME_ZONE: ${CAMELLIA_REMOTE_TIME_ZONE:-Asia/Singapore}
    CAMELLIA_REMOTE_SECRET_KEY: ${CAMELLIA_REMOTE_SECRET_KEY:?Set CAMELLIA_REMOTE_SECRET_KEY to at least 50 random characters}
    CAMELLIA_REMOTE_DATA_ENCRYPTION_KEY: ${CAMELLIA_REMOTE_DATA_ENCRYPTION_KEY:?Set the 32-byte Base64 data encryption key}
    CAMELLIA_REMOTE_DEVICE_VERIFICATION_TOKEN: ${CAMELLIA_REMOTE_DEVICE_VERIFICATION_TOKEN:?Set the shared device verification token}
    CAMELLIA_REMOTE_DATABASE_URL: postgres://${CAMELLIA_REMOTE_POSTGRES_USER:-camellia_remote}:${CAMELLIA_REMOTE_POSTGRES_PASSWORD:?Set CAMELLIA_REMOTE_POSTGRES_PASSWORD}@postgres:5432/${CAMELLIA_REMOTE_POSTGRES_DB:-camellia_remote}
    CAMELLIA_REMOTE_DATABASE_SSLMODE: ${CAMELLIA_REMOTE_DATABASE_SSLMODE:-disable}
    CAMELLIA_REMOTE_DATABASE_CONN_MAX_AGE: ${CAMELLIA_REMOTE_DATABASE_CONN_MAX_AGE:-60}
    CAMELLIA_REMOTE_DATABASE_CONNECT_TIMEOUT: ${CAMELLIA_REMOTE_DATABASE_CONNECT_TIMEOUT:-10}
    CAMELLIA_REMOTE_DEBUG: "false"
    CAMELLIA_REMOTE_LOG_LEVEL: ${CAMELLIA_REMOTE_LOG_LEVEL:-INFO}
    CAMELLIA_REMOTE_LANGUAGE_CODE: ${CAMELLIA_REMOTE_LANGUAGE_CODE:-zh-hans}
    CAMELLIA_REMOTE_ALLOW_REGISTRATION: ${CAMELLIA_REMOTE_ALLOW_REGISTRATION:-false}
    CAMELLIA_REMOTE_ALLOWED_HOSTS: ${CAMELLIA_REMOTE_ALLOWED_HOSTS:?Set the public API hostname}
    CAMELLIA_REMOTE_CSRF_TRUSTED_ORIGINS: ${CAMELLIA_REMOTE_CSRF_TRUSTED_ORIGINS:?Set the public HTTPS origin}
    CAMELLIA_REMOTE_SECURE_TLS: ${CAMELLIA_REMOTE_SECURE_TLS:-true}
    CAMELLIA_REMOTE_SECURE_HSTS_SECONDS: ${CAMELLIA_REMOTE_SECURE_HSTS_SECONDS:-31536000}
    CAMELLIA_REMOTE_SECURE_HSTS_INCLUDE_SUBDOMAINS: ${CAMELLIA_REMOTE_SECURE_HSTS_INCLUDE_SUBDOMAINS:-false}
    CAMELLIA_REMOTE_SECURE_HSTS_PRELOAD: ${CAMELLIA_REMOTE_SECURE_HSTS_PRELOAD:-false}
    CAMELLIA_REMOTE_SESSION_COOKIE_AGE_SECONDS: ${CAMELLIA_REMOTE_SESSION_COOKIE_AGE_SECONDS:-28800}
    CAMELLIA_REMOTE_TRUST_PROXY_HEADERS: ${CAMELLIA_REMOTE_TRUST_PROXY_HEADERS:-false}
    CAMELLIA_REMOTE_TRUSTED_PROXY_CIDRS: ${CAMELLIA_REMOTE_TRUSTED_PROXY_CIDRS:-}
    CAMELLIA_REMOTE_DEFAULT_ID_PORT: ${CAMELLIA_REMOTE_DEFAULT_ID_PORT:-21116}
    CAMELLIA_REMOTE_ID_SERVER: ${CAMELLIA_REMOTE_ID_SERVER:?Set one or more WSS rendezvous endpoints}
    CAMELLIA_REMOTE_RELAY_SERVER: ${CAMELLIA_REMOTE_RELAY_SERVER:-}
    CAMELLIA_REMOTE_API_SERVER: ${CAMELLIA_REMOTE_API_SERVER:?Set the public HTTPS API URL}
    CAMELLIA_REMOTE_RS_PUB_KEY: ${CAMELLIA_REMOTE_RS_PUB_KEY:?Set the rendezvous server public key}
    CAMELLIA_REMOTE_PLUGIN_SIGNING_KEY: ${CAMELLIA_REMOTE_PLUGIN_SIGNING_KEY:-}
    CAMELLIA_REMOTE_RECORD_UPLOAD_ROOT: /app/records
    CAMELLIA_REMOTE_RECORD_UPLOAD_MAX_CHUNK_BYTES: ${CAMELLIA_REMOTE_RECORD_UPLOAD_MAX_CHUNK_BYTES:-4194304}
    CAMELLIA_REMOTE_RECORD_UPLOAD_MAX_FILE_BYTES: ${CAMELLIA_REMOTE_RECORD_UPLOAD_MAX_FILE_BYTES:-10737418240}
    CAMELLIA_REMOTE_OIDC_NAME: ${CAMELLIA_REMOTE_OIDC_NAME:-}
    CAMELLIA_REMOTE_OIDC_ISSUER: ${CAMELLIA_REMOTE_OIDC_ISSUER:-}
    CAMELLIA_REMOTE_OIDC_CLIENT_ID: ${CAMELLIA_REMOTE_OIDC_CLIENT_ID:-}
    CAMELLIA_REMOTE_OIDC_CLIENT_SECRET: ${CAMELLIA_REMOTE_OIDC_CLIENT_SECRET:-}
    CAMELLIA_REMOTE_OIDC_REDIRECT_URI: ${CAMELLIA_REMOTE_OIDC_REDIRECT_URI:-}
    CAMELLIA_REMOTE_OIDC_ALLOWED_HOSTS: ${CAMELLIA_REMOTE_OIDC_ALLOWED_HOSTS:-}
    CAMELLIA_REMOTE_OIDC_SCOPE: ${CAMELLIA_REMOTE_OIDC_SCOPE:-openid email profile}
    CAMELLIA_REMOTE_OIDC_HTTP_TIMEOUT_SECONDS: ${CAMELLIA_REMOTE_OIDC_HTTP_TIMEOUT_SECONDS:-10}
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=128m,mode=1777
  networks:
    - backend

services:
  postgres:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_DB: ${CAMELLIA_REMOTE_POSTGRES_DB:-camellia_remote}
      POSTGRES_USER: ${CAMELLIA_REMOTE_POSTGRES_USER:-camellia_remote}
      POSTGRES_PASSWORD: ${CAMELLIA_REMOTE_POSTGRES_PASSWORD:?Set CAMELLIA_REMOTE_POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - backend

  migrate:
    <<: *application
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  management:
    <<: *application
    environment:
      <<: *application-environment
      CAMELLIA_REMOTE_BIND_HOST: 0.0.0.0
      CAMELLIA_REMOTE_BIND_PORT: "21114"
      CAMELLIA_REMOTE_RUN_MIGRATIONS: "false"
      CAMELLIA_REMOTE_GUNICORN_FORWARDED_ALLOW_IPS: ${CAMELLIA_REMOTE_GUNICORN_FORWARDED_ALLOW_IPS:-127.0.0.1}
      CAMELLIA_REMOTE_GUNICORN_WORKERS: ${CAMELLIA_REMOTE_GUNICORN_WORKERS:-2}
      CAMELLIA_REMOTE_GUNICORN_THREADS: ${CAMELLIA_REMOTE_GUNICORN_THREADS:-2}
      CAMELLIA_REMOTE_GUNICORN_TIMEOUT_SECONDS: ${CAMELLIA_REMOTE_GUNICORN_TIMEOUT_SECONDS:-60}
      CAMELLIA_REMOTE_GUNICORN_GRACEFUL_TIMEOUT_SECONDS: ${CAMELLIA_REMOTE_GUNICORN_GRACEFUL_TIMEOUT_SECONDS:-30}
      CAMELLIA_REMOTE_GUNICORN_KEEP_ALIVE_SECONDS: ${CAMELLIA_REMOTE_GUNICORN_KEEP_ALIVE_SECONDS:-5}
      CAMELLIA_REMOTE_GUNICORN_MAX_REQUESTS: ${CAMELLIA_REMOTE_GUNICORN_MAX_REQUESTS:-1000}
      CAMELLIA_REMOTE_GUNICORN_MAX_REQUESTS_JITTER: ${CAMELLIA_REMOTE_GUNICORN_MAX_REQUESTS_JITTER:-100}
    volumes:
      - recordings:/app/records
    ports:
      - 127.0.0.1:${CAMELLIA_REMOTE_API_BIND_PORT:-21114}:21114
    networks:
      - backend
      - edge
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          request = urllib.request.Request("http://127.0.0.1:21114/health/ready", headers={"X-Forwarded-Proto": "https"});
          response = urllib.request.urlopen(request, timeout=3);
          assert response.status == 200 and json.load(response)["status"] == "ready"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 45s
    restart: unless-stopped

networks:
  backend:
    internal: true
  edge:

volumes:
  postgres-data:
  recordings:
