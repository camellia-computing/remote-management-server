    CAMELLIA_REMOTE_RECORD_MAX_BYTES_GLOBAL: ${CAMELLIA_REMOTE_RECORD_MAX_BYTES_GLOBAL:-10995116277760}
    CAMELLIA_REMOTE_RECORD_ACTIVE_TIMEOUT_MINUTES: ${CAMELLIA_REMOTE_RECORD_ACTIVE_TIMEOUT_MINUTES:-1440}
